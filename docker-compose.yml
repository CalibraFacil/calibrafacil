# Local development infrastructure for Calibra Fácil.
#
#   pnpm setup:dev   # first run: env files, `docker compose up`, migrations, seed
#   pnpm dev         # web :5173, portal :5174, api :3000
#
# Every service stands in for a cloud dependency of the production deployment,
# so no external account is needed to develop:
#
#   postgres       PostgreSQL 17 (production: any managed Postgres)
#   s3             S3-compatible object storage (production: Cloudflare R2)
#   mailpit        Inbox for every email the app sends — http://localhost:8025
#   resend-relay   Accepts Resend API calls and hands them to Mailpit
#   gotenberg      HTML → PDF rendering for certificates and documents
#
# Host ports are deliberately uncommon to avoid clashing with services you may
# already run; override any of them with the variables below (e.g. in a
# root-level .env file read by docker compose).
name: calibra-facil

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: calibra
      POSTGRES_PASSWORD: calibra
      POSTGRES_DB: calibra
    ports:
      - "${CALIBRA_POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calibra -d calibra"]
      interval: 2s
      timeout: 3s
      retries: 30

  s3:
    # Versity S3 Gateway (Apache-2.0) serving a plain directory over the S3 API.
    image: versity/versitygw:v1.8.0
    environment:
      ROOT_ACCESS_KEY: calibra
      ROOT_SECRET_KEY: calibra-dev-secret
    command:
      - --port
      - ":7070"
      - --cors-allow-origin
      - "*"
      - posix
      - /data
    ports:
      - "${CALIBRA_S3_PORT:-59000}:7070"
    volumes:
      - s3-data:/data

  mailpit:
    image: axllent/mailpit:v1.31.3
    environment:
      MP_MAX_MESSAGES: 2000
    ports:
      - "${CALIBRA_MAILPIT_PORT:-8025}:8025"

  resend-relay:
    image: node:24-alpine
    command: ["node", "/relay/server.mjs"]
    environment:
      PORT: 3025
      MAILPIT_URL: http://mailpit:8025
    volumes:
      - ./docker/resend-relay:/relay:ro
    ports:
      - "${CALIBRA_RESEND_RELAY_PORT:-3025}:3025"
    depends_on:
      - mailpit

  gotenberg:
    image: gotenberg/gotenberg:8.37.0
    ports:
      - "${CALIBRA_GOTENBERG_PORT:-3001}:3000"

volumes:
  postgres-data:
  s3-data:
