# Monthly, grouped updates keep the volunteer review load predictable.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  # Base images of the Dockerfiles and the services pinned in the Compose files
  # (docker-compose.yml for development, deploy/ for self-hosting).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    groups:
      images:
        patterns: ["*"]
  - package-ecosystem: docker-compose
    directories: ["/", "/deploy"]
    schedule:
      interval: monthly
    groups:
      compose:
        patterns: ["*"]
