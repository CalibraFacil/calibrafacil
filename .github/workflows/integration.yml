name: Integration tests

# The real-database tier: every *.int.spec.ts in apps/api and apps/worker runs
# against a throwaway PostgreSQL the test setup starts in Docker, from the same
# image docker-compose.yml pins. It takes about a quarter of an hour, so the
# Safety net workflow calls it only for pull requests that touch what it
# covers, and always on main and nightly. It can also be run on its own.
#
# Row-level security is enforced here like in a deployment: the API tier sends
# every request as the database role `calibra_app` (created by
# packages/db/sql/schema-extras.sql in the throwaway Postgres, no secret or URL
# to pass), the worker tier builds its handlers' env as `calibra_app` plus
# DATABASE_OWNER_URL. A statement that forgets its organization fails the job.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    name: Integration (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        app: [api, worker]
    env:
      TZ: UTC

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The test setup runs psql against the container it starts, and the
      # migration specs clone schemas with pg_dump, which refuses a server newer
      # than itself. Install the client matching docker-compose.yml's postgres
      # major (the runner image ships an older one; its PGDG source has 17).
      - name: Ensure psql and pg_dump match the test server
        run: |
          major=$(sed -nE 's/^[[:space:]]*image:[[:space:]]*postgres:([0-9]+).*/\1/p' docker-compose.yml | head -1)
          if ! pg_dump --version 2>/dev/null | grep -qE " ${major}\."; then
            sudo apt-get update
            sudo apt-get install -y "postgresql-client-${major}" || {
              sudo install -d /usr/share/postgresql-common/pgdg
              sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
              echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
              sudo apt-get update
              sudo apt-get install -y "postgresql-client-${major}"
            }
          fi
          pg_dump --version

      - name: Integration tests (apps/${{ matrix.app }})
        run: pnpm --dir apps/${{ matrix.app }} test:integration
