name: Integration tests

# The real-database tier: every *.int.spec.ts in apps/api and apps/worker runs
# against a throwaway PostgreSQL the test setup starts in Docker, from the same
# image docker-compose.yml pins. It takes about a quarter of an hour, so the
# Safety net workflow calls it only for pull requests that touch what it
# covers, and always on main and nightly. It can also be run on its own.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    name: Integration (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        app: [api, worker]
    env:
      TZ: UTC

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The test setup runs psql against the container it starts.
      - name: Ensure psql
        run: command -v psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)

      - name: Integration tests (apps/${{ matrix.app }})
        run: pnpm --dir apps/${{ matrix.app }} test:integration
