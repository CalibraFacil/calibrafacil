name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  ci:
    name: Lint, Type Check & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check blocked dependencies
        run: bun scripts/check-blocked-deps.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Security audit (high)
        run: pnpm audit --prod --audit-level high

      - name: Lint
        run: bun run lint

      - name: Type Check
        run: bun run check-types

      # build the real Vercel function bundles and assert their
      # structural shape (shim default-export form, cron dispatch table, every
      # mounted route surviving into the built artifact). Guards the class of
      # failure behind the 2026-06-24 cron-routing 404 outage and the
      # 2026-06-04/05 Bun default-export boot crashes.
      - name: Assert Vercel function bundle shape (apps/api)
        run: |
          bun apps/api/scripts/build-vercel-functions.mjs
          bun apps/api/scripts/assert-vercel-fn-shape.mjs

      - name: Test
        run: bunx turbo test --filter="[origin/main...HEAD]"
