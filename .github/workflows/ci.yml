name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  ci:
    name: Lint, Type Check & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Check blocked dependencies
        run: bun scripts/check-blocked-deps.mjs

      - name: Setup private Git dependencies
        env:
          MATH_ENGINE_GIT_TOKEN: ${{ secrets.MATH_ENGINE_GIT_TOKEN }}
          MATH_ENGINE_DEPLOY_KEY: ${{ secrets.MATH_ENGINE_DEPLOY_KEY }}
        run: |
          if [ "${{ github.event.pull_request.head.repo.full_name }}" = "${{ github.repository }}" ]; then
            bun scripts/setup-private-git-ssh.mjs --required
          else
            bun scripts/setup-private-git-ssh.mjs
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Security audit (high)
        run: pnpm audit --prod --audit-level high

      - name: Lint
        run: bun run lint

      - name: Type Check
        run: bun run check-types

      - name: Test
        run: bunx turbo test --filter="[origin/main...HEAD]"
