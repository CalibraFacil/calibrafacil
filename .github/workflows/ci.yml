name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Optional Turborepo remote cache. Pull requests from forks get no secrets, so
# both stay empty there and turbo simply builds without the remote cache.
env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  ci:
    name: Lint, Type Check & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check blocked dependencies
        run: bun scripts/check-blocked-deps.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Security audit (high)
        run: pnpm audit --prod --audit-level high

      - name: Lint
        run: bun run lint

      # Keep it flat: `pnpm format` locally; `.prettierignore` carries the
      # byte-stable exclusions (math-engine, generated files).
      - name: Format check
        run: bun run format:check

      - name: Type Check
        run: bun run check-types

      # Build the real Vercel function bundles and assert their structural
      # shape (shim default-export form, cron dispatch table, every mounted
      # route surviving into the built artifact). Guards against cron routes
      # 404ing and default-export boot crashes in the deployed functions.
      - name: Assert Vercel function bundle shape (apps/api)
        run: |
          bun apps/api/scripts/build-vercel-functions.mjs
          bun apps/api/scripts/assert-vercel-fn-shape.mjs

      # Pull requests test the packages they touch; pushes to main test all, and
      # so does any change to dependencies or to the toolchain pins, since a new
      # version can break a package the diff never mentions.
      - name: Test
        env:
          EVENT: ${{ github.event_name }}
        run: |
          filter=""
          if [ "$EVENT" = "pull_request" ] && ! git diff --name-only origin/main...HEAD |
            grep -qE '(^|/)package\.json$|^pnpm-(lock|workspace)\.yaml$|^\.nvmrc$'; then
            filter="--filter=[origin/main...HEAD]"
          fi
          bunx turbo test ${filter:+"$filter"}

  # A pull request that adds or bumps a dependency with a known high or critical
  # vulnerability fails here, before it can merge.
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
