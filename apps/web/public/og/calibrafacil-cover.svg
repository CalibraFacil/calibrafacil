<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <!-- soft blobs: radial gradients fading to transparent, all from the design-system blue scale -->
    <radialGradient id="deepTL" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1C398E" stop-opacity="1"/>
      <stop offset="55%" stop-color="#1447E6" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#1447E6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="indigoBL" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="1"/>
      <stop offset="55%" stop-color="#4338CA" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="deepBR" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1447E6" stop-opacity="1"/>
      <stop offset="60%" stop-color="#193CB8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#193CB8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lightTR" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#BEDBFF" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#8EC5FF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#8EC5FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lightC" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EFF6FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#EFF6FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- base: chart-2 blue -->
  <rect width="1920" height="1080" fill="#2B7FFF"/>

  <!-- atmosphere blobs -->
  <ellipse cx="-120" cy="180" rx="900" ry="780" fill="url(#deepTL)"/>
  <ellipse cx="60" cy="1100" rx="850" ry="720" fill="url(#indigoBL)"/>
  <ellipse cx="1980" cy="1060" rx="1050" ry="820" fill="url(#deepBR)"/>
  <ellipse cx="1780" cy="-40" rx="820" ry="640" fill="url(#lightTR)"/>
  <ellipse cx="960" cy="430" rx="1100" ry="620" fill="url(#lightC)"/>

