<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CalibraFácil OG Preview</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        min-height: 100%;
        background: #09090b;
      }

      body {
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
      }

      picture,
      img {
        display: block;
        max-width: 100%;
        height: auto;
      }
    </style>
  </head>
  <body>
    <picture>
      <source
        srcset="./calibrafacil-cover-dark.png"
        media="(prefers-color-scheme: dark)"
      />
      <img
        src="./calibrafacil-cover-light.png"
        width="1200"
        height="630"
        alt="CalibraFácil, software para laboratórios de calibração"
      />
    </picture>
  </body>
</html>
