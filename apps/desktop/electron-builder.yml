appId: com.calibrafacil.desktop
productName: CalibraFácil
executableName: calibrafacil
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
asar: true
asarUnpack:
  - node_modules/better-sqlite3/**
  # Thermal-printer native modules (.node binaries can't load from inside asar).
  # usb + @serialport/bindings-cpp are N-API, so node-gyp-build picks the napi
  # prebuild under both Node and Electron ABIs — no rebuild step needed.
  - node_modules/usb/**
  - node_modules/serialport/**
  - node_modules/@serialport/**
directories:
  output: out
  buildResources: assets
files:
  - dist/**
  - package.json
  - assets/icon.png
extraMetadata:
  main: dist/main/main.cjs
publish:
  provider: generic
  url: https://updates.calibrafacil.com/desktop
linux:
  icon: assets/icon.png
  target:
    - AppImage
    - deb
  category: Office
  maintainer: CalibraFácil <contato@calibrafacil.com>
win:
  icon: assets/icon.ico
  target:
    - nsis
mac:
  icon: assets/icon.icns
  target:
    - dmg
