appId: com.calibrafacil.desktop
productName: CalibraFácil
executableName: calibrafacil
# Keep the artifact filename ASCII (NOT ${productName} — the accented "á" gets
# stripped from GitHub release asset names but NOT from latest.yml, which breaks
# the auto-update download. See docs/desktop-auto-update.md.
artifactName: CalibraFacil-${version}-${os}-${arch}.${ext}
asar: true
asarUnpack:
  - node_modules/better-sqlite3/**
  # Thermal-printer native modules (.node binaries can't load from inside asar).
  # usb + @serialport/bindings-cpp are N-API, so node-gyp-build picks the napi
  # prebuild under both Node and Electron ABIs — no rebuild step needed.
  - node_modules/usb/**
  - node_modules/serialport/**
  - node_modules/@serialport/**
# Electron fuses, flipped on the packaged binary right before signing. The same
# expectations are asserted against the built binary by
# scripts/check-desktop-fuses.mjs (CI's Desktop job); see docs/desktop-security.md.
electronFuses:
  # Must stay ON for now: the local server is spawned as
  # `process.execPath` with ELECTRON_RUN_AS_NODE=1 (local-server-manager.ts).
  # Turning it off needs the server moved to utilityProcess first.
  runAsNode: true
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  # The renderer is served from the app:// protocol, never file://.
  grantFileProtocolExtraPrivileges: false
directories:
  output: out
  buildResources: assets
files:
  - dist/**
  - package.json
  - assets/icon.png
  # `files` is an allowlist and `buildResources` does not place arbitrary
  # assets in the archive, so the Windows unread-badge overlay has to be named
  # here or `nativeImage.createFromPath` silently returns an empty image.
  - assets/notification-overlay.png
extraMetadata:
  main: dist/main/main.cjs
# Auto-update feed: the installers attached to this repository's GitHub
# releases (see docs/desktop-auto-update.md). scripts/build-desktop-artifact.mjs
# passes the owner and repo, which electron-builder cannot find in a monorepo.
publish:
  provider: github
# calibrafacil:// deep links. Windows registers the scheme from NSIS, macOS
# from the bundle plist, Linux from the .desktop MimeType — each platform needs
# its own declaration, and `app.setAsDefaultProtocolClient` at runtime only
# covers the unpackaged/dev case.
protocols:
  - name: CalibraFácil
    schemes:
      - calibrafacil
linux:
  icon: assets/icon.png
  target:
    - AppImage
    - deb
  category: Office
  maintainer: CalibraFácil <contato@calibrafacil.com>
  mimeTypes:
    - x-scheme-handler/calibrafacil
win:
  icon: assets/icon.ico
  target:
    - nsis
mac:
  icon: assets/icon.icns
  target:
    - dmg
