app = "calibra-facil-web"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile.static"

  [build.args]
    APP_NAME = "web"
    SPA_FALLBACK = "true"
    VITE_API_URL = "https://api.calibrafacil.com"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "256mb"
