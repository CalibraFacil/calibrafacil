packages:
  - "apps/*"
  - "packages/*"

overrides:
  axios@0.30.4: 0.30.3
  axios@1.14.1: 1.14.0
  "@tanstack/react-start": 1.167.3
  "@tanstack/react-start-client": 1.166.17
  "@tanstack/react-start-server": 1.166.17
  "@tanstack/start-client-core": 1.167.2
  "@tanstack/start-plugin-core": 1.167.6
  "@tanstack/start-server-core": 1.167.2
  seroval: ^1.4.1
  next: 16.2.11
  fast-xml-parser: ^5.5.6
  fast-xml-builder: ^1.2.0
  esbuild: ^0.25.12
  "h3@<2": ^1.15.6
  "h3@>=2.0.0-0 <2.0.1-rc.15": ^2.0.1-rc.15
  kysely: ^0.28.17
  lodash: ^4.18.1
  defu: ^6.1.7
  drizzle-orm: ^0.45.2
  node-forge: ^1.4.0
  # GHSA-2v37-7h3g-55p8: nanoid <3.3.18 loops indefinitely when a custom
  # generator is called with size zero. Pulled transitively through postcss
  # under vite (48 paths, all build tooling). postcss declares nanoid ^3.3.17,
  # so the patched 3.3.18 lands inside the range it already expects.
  "nanoid@<3.3.18": ^3.3.18
  "picomatch@<2.3.2": ^2.3.2
  "picomatch@>=4.0.0 <4.0.4": ^4.0.4
  # GHSA-vmh5-mc38-953g / GHSA-cq9c-5vqp-fhqr: undici TLS certificate-validation bypass
  # via dropped requestTls in SOCKS5 ProxyAgent. Pulled transitively via Payload
  # (apps/cms). Patch-bump the 7.x line to the patched 7.28.0 (supersedes the
  # earlier ^7.24.0, which resolved inside the vulnerable range).
  undici: ^7.29.0
  # GHSA-96hv-2xvq-fx4p: ws >=8.0.0 <8.21.0 memory-exhaustion DoS from many tiny
  # fragments. Pulled transitively via Payload (apps/cms). Patch-bump the 8.x
  # line to 8.21.0 (already resolved elsewhere in the tree).
  "ws@>=8.0.0 <8.21.0": ^8.21.0
  "vite@>=6.0.0 <=6.4.1": ^6.4.2
  # GHSA-fx2h-pf6j-xcff: vite <=7.3.4 server.fs.deny bypass via Windows alternate
  # data-stream paths. Only reachable through the dev server (apps/docs build
  # tooling via fumadocs-mdx), never the deployed Linux runtime, but bump the
  # 7.x line to the patched 7.3.5 to keep the prod audit gate clean. Supersedes
  # the earlier >=7.0.0 <=7.3.1 bump.
  "vite@>=7.0.0 <=7.3.4": ^7.3.5
  # GHSA-5xrq-8626-4rwp: vitest <4.1.0 UI-server arbitrary file read. Bump the
  # 4.0.x line (pulled transitively via better-auth) to the patched 4.1.x. Scoped
  # so the 3.2.x users (web/portal/backoffice) aren't forced to a major bump.
  "vitest@>=4.0.0 <4.1.0": ^4.1.8
  "@vitest/coverage-v8@>=4.0.0 <4.1.0": ^4.1.8
  "path-to-regexp@>=8.0.0 <8.4.0": ^8.4.0
  diff: ^8.0.3
  basic-ftp: ^5.3.1
  rollup: ^4.59.0
  svgo: ^4.0.1
  "@xmldom/xmldom": ^0.8.13
  fast-uri: ^3.1.5
  samlify: ^2.13.0
  # GHSA-rgw5-rvv9-x895: brace-expansion >=4.0.0 <5.0.9 DoS via unbounded
  # intermediate arrays (bypasses the CVE-2026-14257 mitigation). Transitive via
  # @vercel/queue>minimatch. Scoped to the 4.x/5.x line so the 1.x/2.x users are
  # untouched.
  "brace-expansion@>=4.0.0 <5.0.9": ^5.0.9
  # GHSA advisories on js-yaml <4.3.0 and immutable <4.3.9, both transitive.
  "js-yaml@>=4.0.0 <4.3.0": ^4.3.0
  "immutable@>=4.0.0 <4.3.9": ^4.3.9
  # builder-util-runtime <9.7.0, transitive via electron-builder (desktop only).
  "builder-util-runtime@<9.7.0": ^9.7.0
  # GHSA-6g55-p6wh-862q + GHSA-r28c-9q8g-f849: postcss <=8.5.17 arbitrary .map
  # file disclosure via attacker-controlled sourceMappingURL. Build-time only,
  # but the prod audit gate counts it.
  postcss: ^8.5.18
  # GHSA-f88m-g3jw-g9cj: sharp <0.35.0 inherits four libvips CVEs.
  sharp: ^0.35.0
  # GHSA-28wg-ghj8-5hjv: nanoid >=4.0.0 <5.1.16 can loop indefinitely on a
  # negative size. Transitive via @scalar/hono-api-reference (apps/api). Scoped
  # to the 5.x line so the 3.3.x users elsewhere in the tree are untouched.
  "nanoid@>=4.0.0 <5.1.16": ^5.1.16

auditConfig:
  ignoreGhsas:
    - GHSA-rmmr-r34h-pfm5
    # GHSA-gv7w-rqvm-qjhr: esbuild <0.28.1 missing binary integrity verification
    # in its *Deno* install module, exploitable only via an attacker-controlled
    # NPM_CONFIG_REGISTRY. We consume esbuild purely as a build-time tool under
    # Node/pnpm via vite (never the Deno module, never in the prod runtime), so
    # the vector doesn't apply. The patched line (>=0.28.1) is newer than every
    # vite in the tree expects (vite 7.3.x pins esbuild ^0.27.0, 6.4.x ^0.25.0),
    # so we hold esbuild at ^0.25.12 (see overrides) instead of a forced bump.
    - GHSA-gv7w-rqvm-qjhr
    # image-size <=2.0.2 DoS: two advisories over the same unpatched code —
    # GHSA-5p2g-fcmc-qvqq (JXL/HEIF parsers) and GHSA-w3rx-r6r6-pgpr (ICNS
    # parser, infinite loop). There is NO patched release: both name >=2.0.3,
    # but npm's latest is 2.0.2 and the only other dist-tag is legacy 1.2.1
    # (checked 2026-08-08) — there is nothing to bump to. Reachable only through
    # Payload's upload handler in apps/cms, whose admin has no public sign-up
    # and is authored solely by the operator; impact is a CMS-only denial of
    # service. Replace BOTH with an override the moment 2.0.3 ships.
    - GHSA-5p2g-fcmc-qvqq
    - GHSA-w3rx-r6r6-pgpr

# Force pnpm to materialize ALL linux native optional binaries (glibc + musl,
# x64 + arm64), not just the one matching the install machine. Vercel's
# @vercel/nft file-tracer walks @resvg/resvg-js's optionalDependencies when
# bundling the API serverless functions and stat()s every platform variant; if
# the musl binary isn't on disk it fails the deploy with
# "ENOENT ... @resvg+resvg-js-linux-x64-musl". Listing the architectures here
# makes those packages present so the trace always resolves. (resvg only runs
# at runtime on the deployed glibc target; the extra binaries are unused weight.)
supportedArchitectures:
  os:
    - linux
    - current
  cpu:
    - x64
    - arm64
    - current
  libc:
    - glibc
    - musl
    - current

onlyBuiltDependencies:
  - "@serialport/bindings-cpp"
  - better-sqlite3
  - electron
  - electron-winstaller
  - esbuild
  - msw
  - sharp
  - usb
  - workerd

allowBuilds:
  "@serialport/bindings-cpp": true
  better-sqlite3: true
  electron: true
  electron-winstaller: true
  esbuild: true
  msw: true
  sharp: true
  usb: true
  workerd: true

