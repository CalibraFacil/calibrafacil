packages:
  - "apps/*"
  - "packages/*"

overrides:
  axios@0.30.4: 0.30.3
  axios@1.14.1: 1.14.0
  "@tanstack/react-start": 1.167.3
  "@tanstack/react-start-client": 1.166.17
  "@tanstack/react-start-server": 1.166.17
  "@tanstack/start-client-core": 1.167.2
  "@tanstack/start-plugin-core": 1.167.6
  "@tanstack/start-server-core": 1.167.2
  # GHSA-p6vx-979v-rg4c (critical, <=1.6.0) and GHSA-jp82-f5mq-hwhp (high,
  # <=1.6.2): seroval's JSON deserialization; reached through TanStack Router.
  seroval: ^1.6.3
  # GHSA-vcvr-r3jv-pc5j: next >=16.2.0 <16.3.6 remote code execution in
  # next/og ImageResponse. apps/docs pins the same version.
  next: 16.3.8
  fast-xml-parser: ^5.5.6
  fast-xml-builder: ^1.2.0
  # Held at ^0.25.12 for vite compatibility (vite 7.3.x pins esbuild ^0.27.0,
  # 6.4.x ^0.25.0). This used to double as the mitigation for
  # GHSA-gv7w-rqvm-qjhr, but GitHub withdrew that advisory on 2026-06-17, so
  # the hold is now purely a compatibility pin.
  esbuild: ^0.25.12
  "h3@<2": ^1.15.6
  "h3@>=2.0.0-0 <2.0.1-rc.15": ^2.0.1-rc.15
  kysely: ^0.28.17
  lodash: ^4.18.1
  defu: ^6.1.7
  drizzle-orm: ^0.45.2
  node-forge: ^1.4.0
  # GHSA-2v37-7h3g-55p8: nanoid <3.3.18 loops indefinitely when a custom
  # generator is called with size zero. Pulled transitively through postcss
  # under vite (48 paths, all build tooling). postcss declares nanoid ^3.3.17,
  # so the patched 3.3.18 lands inside the range it already expects.
  "nanoid@<3.3.18": ^3.3.18
  # GHSA-68fv-2mgg-jv7q: source-map-js <1.2.2 event-loop DoS on crafted
  # indexed source maps. Build tooling only (postcss).
  "source-map-js@<1.2.2": ^1.2.2
  "picomatch@<2.3.2": ^2.3.2
  "picomatch@>=4.0.0 <4.0.4": ^4.0.4
  # GHSA-rfgv-xxqx-mfg5 (DoS via an unrequested WebSocket subprotocol) and
  # GHSA-w293-vg96-wgc3 (TLS certificate-validation bypass via dropped connect
  # options): undici <7.29.1. Transitive via jsdom (test tooling). Supersedes
  # the earlier ^7.29.0 bump for GHSA-vmh5-mc38-953g / GHSA-cq9c-5vqp-fhqr.
  undici: ^7.29.1
  # GHSA-96hv-2xvq-fx4p: ws >=8.0.0 <8.21.0 memory-exhaustion DoS from many tiny
  # fragments. Pulled transitively via Payload (apps/cms). Patch-bump the 8.x
  # line to 8.21.0 (already resolved elsewhere in the tree).
  "ws@>=8.0.0 <8.21.0": ^8.21.0
  "vite@>=6.0.0 <=6.4.1": ^6.4.2
  # GHSA-fx2h-pf6j-xcff: vite <=7.3.4 server.fs.deny bypass via Windows alternate
  # data-stream paths. Only reachable through the dev server (apps/docs build
  # tooling via fumadocs-mdx), never the deployed Linux runtime, but bump the
  # 7.x line to the patched 7.3.5 to keep the prod audit gate clean. Supersedes
  # the earlier >=7.0.0 <=7.3.1 bump.
  "vite@>=7.0.0 <=7.3.4": ^7.3.5
  # GHSA-5xrq-8626-4rwp: vitest <4.1.0 UI-server arbitrary file read, and
  # GHSA-82fw-gwwq-j7x9: vitest/@vitest/mocker <4.1.11 arbitrary file read through
  # a redirected mock. Lift the 4.x line (also pulled transitively via
  # better-auth) to 4.1.11 without crossing to 5.x.
  "vitest@>=4.0.0 <4.1.11": ^4.1.11
  "@vitest/coverage-v8@>=4.0.0 <4.1.11": ^4.1.11
  "path-to-regexp@>=8.0.0 <8.4.0": ^8.4.0
  diff: ^8.0.3
  basic-ftp: ^5.3.1
  rollup: ^4.59.0
  svgo: ^4.0.1
  # GHSA-6gmq-8vp8-gcm6: @xmldom/xmldom <=0.8.14 mis-parses crafted markup.
  # Stay on the 0.8 line (0.9.x is a breaking parser rewrite, and packages/auth
  # depends on the 0.8 API) — 0.8.15 is the patched release on that line.
  "@xmldom/xmldom": ^0.8.15
  # Four high advisories against fast-uri <3.1.6 — GHSA-f65p-4m7j-42xc and
  # GHSA-fph4-wmhf-6fwf (SSRF via malformed IPv6 normalization / repeated
  # hostname percent-decoding) plus GHSA-jqff-g426-hqxp and GHSA-5jgf-p345-68v8
  # (host confusion via percent-encoded scheme normalization / skipped IDN
  # canonicalization). Transitive via Payload > ajv (apps/cms). Stay on the 3.x
  # line — ajv depends on ^3.x, and npm's `latest` is 4.1.4 — so this resolves
  # to 3.1.7 off the `three` dist-tag. Supersedes the earlier ^3.1.5, which now
  # sits inside the vulnerable range.
  # GHSA-hrr3-gc8f-f4qj (host case normalization via percent-encoded octets)
  # needs 3.1.8.
  fast-uri: ^3.1.8
  # GHSA-73wf-gq98-2v4g + GHSA-c83g-rgw3-j3cx: browserslist <=4.28.6 crashes /
  # writes to Object.prototype on an untrusted browserslist-stats.json, and
  # grows its query cache without eviction. Build-time only (transitive via
  # @tanstack/router-plugin > @babel/core in apps/web, on stats files we
  # author ourselves), but the prod audit gate counts it.
  browserslist: ^4.28.7
  samlify: ^2.13.0
  # GHSA-rgw5-rvv9-x895, GHSA-6j4f-fj2g-mc7p and GHSA-qhr7-859c-m2p7:
  # brace-expansion >=4.0.0 <5.0.11 DoS (unbounded intermediate arrays,
  # uncontrolled recursion). Transitive via @vercel/queue>minimatch. Scoped to
  # the 4.x/5.x line so the 1.x/2.x users are untouched.
  "brace-expansion@>=4.0.0 <5.0.11": ^5.0.11
  # The same DoS family (GHSA-3jxr-9vmj-r5cp, GHSA-mh99-v99m-4gvg,
  # GHSA-rgw5-rvv9-x895) also lands on the 1.x and 2.x lines still present in
  # the tree via apps/desktop and apps/web tooling. Each line has its own
  # patched release; scope per line so no consumer is forced across a major.
  # GHSA-q2hr-2g5m-vwhr (quadratic `{a},b}` rewrite) then moved both floors
  # again: 1.1.21 and 2.1.7.
  "brace-expansion@<1.1.21": ^1.1.21
  "brace-expansion@>=2.0.0 <2.1.7": ^2.1.7
  # GHSA advisories on js-yaml <4.3.2 and immutable <4.3.9, both transitive.
  "js-yaml@>=4.0.0 <4.3.2": ^4.3.2
  "immutable@>=4.0.0 <4.3.9": ^4.3.9
  # builder-util-runtime <9.7.0, transitive via electron-builder (desktop only).
  "builder-util-runtime@<9.7.0": ^9.7.0
  # GHSA-6g55-p6wh-862q + GHSA-r28c-9q8g-f849: postcss <=8.5.17 arbitrary .map
  # file disclosure via attacker-controlled sourceMappingURL. Build-time only,
  # but the prod audit gate counts it.
  postcss: ^8.5.18
  # GHSA-f88m-g3jw-g9cj: sharp <0.35.0 inherits four libvips CVEs. GHSA-rgj7-g3m4-5g8c
  # adds two more libheif CVEs against <0.35.4.
  # GHSA-wq5f-xc86-pv6w: sharp <0.35.5 bundles a vulnerable librsvg.
  sharp: ^0.35.5
  # GHSA-28wg-ghj8-5hjv: nanoid >=4.0.0 <5.1.16 can loop indefinitely on a
  # negative size. Transitive via @scalar/hono-api-reference (apps/api). Scoped
  # to the 5.x line so the 3.3.x users elsewhere in the tree are untouched.
  "nanoid@>=4.0.0 <5.1.16": ^5.1.16
  # --- Advisory sweep 2026-09-04 -------------------------------------------
  # Every entry below is a transitive dependency with a published patched
  # release on its own major line. Direct dependencies (hono, @hono/node-server
  # in local-server, electron, electron-builder) were bumped in their own
  # package.json instead of being overridden here.
  #
  # GHSA-9mqv-5hh9-4cgg + GHSA-frvp-7c67-39w9: @hono/node-server request
  # smuggling / header handling. The 1.x line survives in apps/web build
  # tooling; scope it so local-server's 2.x is untouched.
  "@hono/node-server@<1.19.15": ^1.19.15
  # Seven advisories against hono <4.12.34 (body-limit bypass, proxy header
  # trust, path-normalisation confusion), then GHSA-hxh3-vqpv-xpqv: hono/jsx
  # renders plain strings unescaped in boundary components (<4.13.7). Every
  # workspace package declares ^4.13.7 directly, but the shadcn CLI pulls its
  # own older 4.x through @modelcontextprotocol/sdk, so the range is forced
  # tree-wide.
  "hono@<4.13.7": ^4.13.7
  # 18 advisories (14 moderate, 4 low) against dompurify — a long tail of
  # mXSS sanitizer bypasses, all superseded by 3.4.13. Transitive via Payload
  # (apps/cms) for the rich-text editor.
  dompurify: ^3.4.13
  # GHSA-v422-hmwv-36x6: body-parser <2.3.0 DoS on malformed urlencoded input.
  "body-parser@>=2.0.0 <2.3.0": ^2.3.0
  # GHSA-hmw2-7cc7-3qxx: form-data <4.0.6 unsafe random boundary generation.
  "form-data@>=4.0.0 <4.0.6": ^4.0.6
  # GHSA-mwp4-54f8-5fhr (high) + GHSA-4xrf-jv44-h6hh + GHSA-22jq-vg5j-6vgg:
  # ip-address <=10.3.0 parses malformed addresses permissively, which defeats
  # SSRF allow/deny lists built on it.
  # GHSA-h3mg-xc3c-68pw and GHSA-j6r3-76f7-8jcv (unbounded parse diagnostics,
  # cross-family isInSubnet) need 10.7.1.
  "ip-address@<10.7.1": ^10.7.1
  # GHSA-w9m9-85wc-3x92: postcss-selector-parser <7.1.3 ReDoS. Build-time only.
  "postcss-selector-parser@>=7.1.0 <7.1.3": ^7.1.3
  # GHSA-4mjr-xmp4-gh2g + GHSA-x5fp-wj9c-mxmx: qs prototype-pollution and
  # parameter-parsing DoS. 6.16.0 clears both.
  "qs@>=6.14.2 <6.16.0": ^6.16.0
  # GHSA-395f-4hp3-45gv: shell-quote <=1.8.4 command injection through crafted
  # quoting, then GHSA-pqg4-j6r4-53mv (critical): quote() command injection via
  # a line terminator after a { comment } token, below 1.11.0.
  "shell-quote@<1.11.0": ^1.11.0
  # GHSA-2m8v-j782-fhvr: socket.io-parser <4.2.7 prototype pollution while
  # decoding untrusted packets. Transitive via packages/email's preview server.
  "socket.io-parser@>=4.0.0 <4.2.7": ^4.2.7
  # Six advisories against tar, including GHSA-23hp-3jrh-7fpw (critical, path
  # traversal on crafted archives) — 7.5.21 is the first release clearing all
  # of them. Transitive via the electron-builder chain in apps/desktop.
  "tar@<7.5.21": ^7.5.21
  # GHSA-ph9p-34f9-6g65: tmp <0.2.6 symlink-following lets a local attacker
  # write outside the temp dir. Transitive via electron-builder.
  "tmp@<0.2.6": ^0.2.6
  # GHSA-jqcg-44mw-7w3h (critical): proxy-addr <2.0.8 lets an IPv4-mapped IPv6
  # address spoof a trusted subnet. Transitive via express in the shadcn CLI's
  # @modelcontextprotocol/sdk (apps/web build tooling).
  "proxy-addr@<2.0.8": ^2.0.8
  # GHSA-6qxp-vccf-f47h: @modelcontextprotocol/sdk >=1.12.0 <1.31.0 OAuth client
  # can send credentials to the wrong authorization server. Same shadcn path.
  "@modelcontextprotocol/sdk@>=1.12.0 <1.31.0": ^1.31.0
  # GHSA-2gc4-cqfq-p2gv: engine.io >=6.6.0 <6.6.10 protocol-revision DoS.
  # Transitive via react-email's preview server (packages/email).
  "engine.io@>=6.6.0 <6.6.10": ^6.6.10
  # GHSA-6hxq-p678-4hr2: @simplewebauthn/server <=13.3.1 doesn't check that
  # attestation certificates chain to a trusted root. packages/auth declares
  # 13.3.2; @better-auth/passkey pins 13.3.1 exactly.
  "@simplewebauthn/server@<13.3.2": 13.3.2
  # GHSA-238p-pmpm-9mq7: katex <0.18.2 lets existing prototype pollution bypass
  # its trust restrictions. apps/docs declares ^0.18.2; remark-math and
  # rehype-katex still ask for 0.16.
  "katex@>=0.11.0 <0.18.2": ^0.18.2
  # Not an advisory. Every workspace package declares zod ^4.4.3 and the tree
  # had settled on 4.4.3, but declaring it in apps/desktop re-resolved the range
  # and moved better-auth's `better-call` peer slot to 4.5.4. From there
  # packages/auth's inferred Better Auth types can no longer be named without
  # referencing zod's internal `$strip`, and every `createLabAuth`-style export
  # fails to type-check (TS2883). Hold the line at the version the auth package
  # is known to work with; lift it deliberately, with those annotations added.
  zod: 4.4.3

auditConfig:
  ignoreGhsas:
    # GHSA-86w9-cpqp-85rv: node-forge <=1.4.0 RSA PKCS#1 v1.5 signature
    # verification accepts extra nested DigestAlgorithm elements. There is NO
    # patched release: the advisory names >=1.4.1, but npm's latest is 1.4.0
    # (re-checked 2026-10-01). Not reachable here: packages/signing uses
    # node-forge only to parse A1 (P12) certificates and, through
    # @signpdf/signer-p12, to create signatures; certificate-chain and CRL
    # verification go through pkijs/WebCrypto. Replace with an override the
    # moment a patched node-forge ships.
    - GHSA-86w9-cpqp-85rv

# Force pnpm to materialize ALL linux native optional binaries (glibc + musl,
# x64 + arm64), not just the one matching the install machine. Vercel's
# @vercel/nft file-tracer walks @resvg/resvg-js's optionalDependencies when
# bundling the API serverless functions and stat()s every platform variant; if
# the musl binary isn't on disk it fails the deploy with
# "ENOENT ... @resvg+resvg-js-linux-x64-musl". Listing the architectures here
# makes those packages present so the trace always resolves. (resvg only runs
# at runtime on the deployed glibc target; the extra binaries are unused weight.)
supportedArchitectures:
  os:
    - linux
    - current
  cpu:
    - x64
    - arm64
    - current
  libc:
    - glibc
    - musl
    - current

onlyBuiltDependencies:
  - "@serialport/bindings-cpp"
  - better-sqlite3
  - electron
  - electron-winstaller
  - esbuild
  - msw
  - sharp
  - usb
  - workerd

allowBuilds:
  "@serialport/bindings-cpp": true
  better-sqlite3: true
  electron: true
  electron-winstaller: true
  esbuild: true
  msw: true
  sharp: true
  usb: true
  workerd: true

