# Calibra Fácil, self-hosted: everything on one machine with Docker.
#
#   ./setup.sh                  # once: writes .env (domains, e-mail, secrets)
#   docker compose up -d        # start; https certificates come from Let's Encrypt
#   docker compose exec api bun src/cli/create-lab.ts --name "…" --email you@…
#
# Services:
#   caddy     HTTPS for the three addresses in .env, routes /api to the API
#   init      one-shot: schema, calibra_app login, catalogs, buckets, portal service account
#   api       Hono API on Bun; also runs the scheduled jobs (CRON_SCHEDULER)
#   worker    renders certificates and documents, sends queued e-mails
#   web       lab app          (APP_URL)
#   portal    client portal    (PORTAL_URL)
#   postgres  PostgreSQL 17
#   s3        S3-compatible file storage (FILES_URL)
#   gotenberg HTML → PDF
#   mailpit   optional test inbox: COMPOSE_PROFILES=mailpit (see .env.example)
#   backup    optional: COMPOSE_PROFILES=backup. Daily pg_dump + object-store mirror
#             into ./backups (docs/operations/backup-restore.md)
#
# Every service rotates its logs (LOG_MAX_SIZE x LOG_MAX_FILE), is capped in memory
# (MEM_LIMIT_*, see .env.example) and restarts unless stopped. The app images run
# as an unprivileged user.
#
# Images come from GHCR. To build them from this checkout instead:
#   docker compose -f compose.yaml -f compose.build.yaml up -d --build
#
# See DEPLOYMENT.md for updates, backups and using hosted services instead.
name: calibrafacil

# Container logs are kept by Docker's json-file driver: rotate them so they cannot
# fill the disk (`docker compose logs` reads what is kept).
x-logging: &logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: ${LOG_MAX_FILE:-5}

# What the app containers (api, worker, init, web, portal) never need.
x-hardened: &hardened
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

x-app-env: &app-env
  NODE_ENV: production
  # Row-level security: the API and worker log in as calibra_app (the tenant
  # policies bind it); the owner is the system path and runs the migrations.
  # `init` creates the login with CALIBRA_APP_PASSWORD on every start.
  DATABASE_URL: postgres://calibra_app:${CALIBRA_APP_PASSWORD:?run ./setup.sh first (or add CALIBRA_APP_PASSWORD to .env, see DEPLOYMENT.md)}@postgres:5432/calibra
  DATABASE_OWNER_URL: postgres://calibra:${POSTGRES_PASSWORD:?run ./setup.sh first}@postgres:5432/calibra
  DATABASE_RLS_MODE: enforced
  API_URL: ${APP_URL:?set APP_URL in .env}
  APP_URL: ${APP_URL}
  PORTAL_APP_URL: ${PORTAL_URL:?set PORTAL_URL in .env}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?run ./setup.sh first}
  PORTAL_SERVICE_USER_ID: portal-service
  # File storage: the API and worker use the internal address; links handed
  # to browsers are signed for FILES_URL, which Caddy serves.
  R2_ENDPOINT: http://s3:7070
  R2_PUBLIC_ENDPOINT: ${FILES_URL:?set FILES_URL in .env}
  R2_REGION: us-east-1
  R2_ACCESS_KEY_ID: calibra
  R2_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?run ./setup.sh first}
  R2_BUCKET_NAME: calibra-documents
  R2_MEDIA_BUCKET_NAME: calibra-media
  GOTENBERG_URL: http://gotenberg:3000
  # Background jobs wait in the database for the worker.
  BACKGROUND_JOBS_MODE: queue
  CRON_SCHEDULER: internal
  # The API sits behind one reverse proxy (Caddy), which writes X-Forwarded-For:
  # the client's address for the audit trail and the rate limits is the entry it
  # appended. Raise it if another proxy (a load balancer) stands in front of Caddy.
  TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
  # Bearer token of GET /api/metrics (Prometheus); unset: the endpoint answers 404.
  METRICS_TOKEN: ${METRICS_TOKEN:-}
  CRON_SECRET: ${CRON_SECRET:?run ./setup.sh first}
  SIGNING_MASTER_KEY: ${SIGNING_MASTER_KEY:?run ./setup.sh first}
  SIGNING_MASTER_KEY_ID: ${SIGNING_MASTER_KEY_ID:-}
  SIGNING_MASTER_KEY_PREVIOUS: ${SIGNING_MASTER_KEY_PREVIOUS:-}
  SIGNING_TRUST_STORE_FILE: ${SIGNING_TRUST_STORE_FILE:-}
  SIGNING_TSA_URL: ${SIGNING_TSA_URL:-}
  SIGNING_TSA_AUTH: ${SIGNING_TSA_AUTH:-}
  SIGNING_TSA_ICP_CONFORMANT: ${SIGNING_TSA_ICP_CONFORMANT:-}
  SIGNING_TSA_TIMEOUT_MS: ${SIGNING_TSA_TIMEOUT_MS:-}
  INTEGRATIONS_MASTER_KEY: ${INTEGRATIONS_MASTER_KEY:?run ./setup.sh first}
  PUBLIC_API_MASTER_KEY: ${PUBLIC_API_MASTER_KEY:?run ./setup.sh first}
  OUTBOUND_ALLOW_PRIVATE_HOSTS: ${OUTBOUND_ALLOW_PRIVATE_HOSTS:-}
  OUTBOUND_ALLOW_INSECURE_HTTP: ${OUTBOUND_ALLOW_INSECURE_HTTP:-}
  EMAIL_DOMAIN_MASTER_KEY: ${EMAIL_DOMAIN_MASTER_KEY:?run ./setup.sh first}
  QUOTE_APPROVAL_CODE_PEPPER: ${QUOTE_APPROVAL_CODE_PEPPER:?run ./setup.sh first}
  EMAIL_FROM: ${EMAIL_FROM:?set EMAIL_FROM in .env}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-}
  SMTP_SECURE: ${SMTP_SECURE:-}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  RESEND_API_KEY: ${RESEND_API_KEY:-}

services:
  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    logging: *logging
    mem_limit: ${MEM_LIMIT_CADDY:-256m}
    healthcheck:
      # Caddy's admin endpoint answers once the configuration is loaded.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    ports:
      - "${HTTP_BIND:-80}:80"
      - "${HTTPS_BIND:-443}:443"
      - "${HTTPS_BIND:-443}:443/udp"
    environment:
      APP_URL: ${APP_URL}
      PORTAL_URL: ${PORTAL_URL}
      FILES_URL: ${FILES_URL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
      - web
      - portal
      - s3

  init:
    image: ghcr.io/calibrafacil/calibrafacil-api:${CALIBRA_VERSION:-latest}
    command: ["bun", "src/cli/init.ts"]
    # One-shot: runs to completion on every `up`, never restarted by itself.
    restart: "no"
    <<: *hardened
    logging: *logging
    mem_limit: ${MEM_LIMIT_INIT:-1g}
    environment:
      <<: *app-env
      # Session timeouts of the calibra_app role (ALTER ROLE ... SET, only that role;
      # the owner and the migrations are unaffected). 0 turns one off.
      DB_APP_STATEMENT_TIMEOUT_MS: ${DB_APP_STATEMENT_TIMEOUT_MS:-120000}
      DB_APP_IDLE_IN_TRANSACTION_TIMEOUT_MS: ${DB_APP_IDLE_IN_TRANSACTION_TIMEOUT_MS:-60000}
    depends_on:
      postgres:
        condition: service_healthy
      s3:
        condition: service_started

  api:
    image: ghcr.io/calibrafacil/calibrafacil-api:${CALIBRA_VERSION:-latest}
    restart: unless-stopped
    # On SIGTERM the API stops taking requests and waits up to SHUTDOWN_GRACE_MS
    # (25 s by default) for the ones running; Docker kills it after this period,
    # so keep it above SHUTDOWN_GRACE_MS.
    stop_grace_period: 40s
    <<: *hardened
    logging: *logging
    mem_limit: ${MEM_LIMIT_API:-1g}
    environment: *app-env
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://localhost:3000/api').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      init:
        condition: service_completed_successfully
      gotenberg:
        condition: service_started

  worker:
    image: ghcr.io/calibrafacil/calibrafacil-worker:${CALIBRA_VERSION:-latest}
    restart: unless-stopped
    # On SIGTERM the worker claims no further job and waits up to
    # SHUTDOWN_GRACE_MS (25 s by default) for the one in hand (a certificate
    # render); keep this above SHUTDOWN_GRACE_MS.
    stop_grace_period: 40s
    <<: *hardened
    logging: *logging
    mem_limit: ${MEM_LIMIT_WORKER:-1g}
    environment: *app-env
    healthcheck:
      # The worker has no port: each poll tick (every 2 s, and around every job)
      # touches /tmp/calibra-worker-heartbeat (apps/worker/src/heartbeat.ts). A file
      # older than 5 minutes means the loop is stuck.
      test:
        - CMD
        - bun
        - -e
        - "process.exit(Date.now() - require('node:fs').statSync('/tmp/calibra-worker-heartbeat').mtimeMs < 300000 ? 0 : 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      init:
        condition: service_completed_successfully
      gotenberg:
        condition: service_started

  web:
    image: ghcr.io/calibrafacil/calibrafacil-web:${CALIBRA_VERSION:-latest}
    restart: unless-stopped
    <<: *hardened
    logging: *logging
    mem_limit: ${MEM_LIMIT_WEB:-192m}
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://127.0.0.1:8080/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Read by the browser at startup (public values only).
    environment:
      VITE_PORTAL_APP_URL: ${PORTAL_URL}
      VITE_OPERATOR_LEGAL_NAME: ${OPERATOR_LEGAL_NAME:-}
      VITE_OPERATOR_CNPJ: ${OPERATOR_CNPJ:-}
      VITE_OPERATOR_ADDRESS: ${OPERATOR_ADDRESS:-}
      VITE_OPERATOR_EMAIL: ${OPERATOR_EMAIL:-}

  portal:
    image: ghcr.io/calibrafacil/calibrafacil-portal:${CALIBRA_VERSION:-latest}
    restart: unless-stopped
    <<: *hardened
    logging: *logging
    mem_limit: ${MEM_LIMIT_PORTAL:-192m}
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://127.0.0.1:8080/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      VITE_WEB_URL: ${APP_URL}

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    mem_limit: ${MEM_LIMIT_POSTGRES:-1g}
    environment:
      POSTGRES_USER: calibra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: calibra
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U calibra -d calibra"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 10s

  s3:
    # Versity S3 Gateway (Apache-2.0): a plain directory served over the S3 API.
    image: versity/versitygw:v1.10.0
    restart: unless-stopped
    logging: *logging
    mem_limit: ${MEM_LIMIT_S3:-512m}
    healthcheck:
      # The gateway answers every unsigned request with 403, so check the port.
      test: ["CMD", "nc", "-z", "127.0.0.1", "7070"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      ROOT_ACCESS_KEY: calibra
      ROOT_SECRET_KEY: ${S3_SECRET_KEY}
    # Browsers download and upload with presigned links; CORS lets the app do
    # it from script.
    command: ["--port", ":7070", "--cors-allow-origin", "*", "posix", "/data"]
    volumes:
      - s3-data:/data

  gotenberg:
    image: gotenberg/gotenberg:8.38.1
    restart: unless-stopped
    logging: *logging
    # Chromium and LibreOffice render the PDFs; the heaviest container.
    mem_limit: ${MEM_LIMIT_GOTENBERG:-1536m}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  mailpit:
    image: axllent/mailpit:v1.32.0
    profiles: ["mailpit"]
    restart: unless-stopped
    logging: *logging
    mem_limit: ${MEM_LIMIT_MAILPIT:-128m}
    ports:
      - "${MAILPIT_BIND:-127.0.0.1:8025}:8025"

  # Scheduled backups: COMPOSE_PROFILES=backup (or `docker compose --profile backup
  # up -d backup`). Not started by default. A daily pg_dump (custom format, checked,
  # optionally encrypted with age) and a mirror of the object-store buckets go to
  # ${BACKUP_DIR:-./backups}, with retention. See docs/operations/backup-restore.md,
  # which also covers restoring (./restore.sh) and moving the copies off this machine.
  # With a hosted object store, set the R2_* values below like the ones in x-app-env.
  backup:
    profiles: ["backup"]
    build: ./backup
    image: calibrafacil-backup:local
    restart: unless-stopped
    logging: *logging
    mem_limit: ${MEM_LIMIT_BACKUP:-256m}
    # A backup in progress is worth finishing before the container stops.
    stop_grace_period: 2m
    environment:
      DATABASE_OWNER_URL: postgres://calibra:${POSTGRES_PASSWORD:?run ./setup.sh first}@postgres:5432/calibra
      R2_ENDPOINT: http://s3:7070
      R2_REGION: us-east-1
      R2_ACCESS_KEY_ID: calibra
      R2_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?run ./setup.sh first}
      R2_BUCKET_NAME: calibra-documents
      R2_MEDIA_BUCKET_NAME: calibra-media
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-02:30}
      BACKUP_ON_START: ${BACKUP_ON_START:-true}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_KEEP_MIN: ${BACKUP_KEEP_MIN:-3}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      BACKUP_FILES: ${BACKUP_FILES:-true}
      BACKUP_OFFSITE_URI: ${BACKUP_OFFSITE_URI:-}
      BACKUP_OFFSITE_ENDPOINT: ${BACKUP_OFFSITE_ENDPOINT:-}
      BACKUP_OFFSITE_REGION: ${BACKUP_OFFSITE_REGION:-}
      BACKUP_OFFSITE_ACCESS_KEY_ID: ${BACKUP_OFFSITE_ACCESS_KEY_ID:-}
      BACKUP_OFFSITE_SECRET_ACCESS_KEY: ${BACKUP_OFFSITE_SECRET_ACCESS_KEY:-}
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
    healthcheck:
      # Unhealthy when no backup has finished for 36 hours (the schedule is daily).
      test: ["CMD-SHELL", "test -n \"$$(find /backups/.last-success -mmin -2160 2>/dev/null)\""]
      interval: 1h
      timeout: 10s
      retries: 1
      start_period: 10m
    depends_on:
      init:
        condition: service_completed_successfully
      s3:
        condition: service_started

volumes:
  postgres-data:
  s3-data:
  caddy-data:
  caddy-config:
